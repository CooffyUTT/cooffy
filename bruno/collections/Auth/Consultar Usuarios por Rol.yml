info:
  name: Consultar Usuarios por Rol
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:8000/api/auth/?role=cliente
  params:
    - name: role
      value: gerente
      type: query
      disabled: true
    - name: role
      value: empleado
      type: query
      disabled: true
    - name: role
      value: cliente
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
