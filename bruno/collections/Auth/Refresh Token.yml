info:
  name: Refresh Token
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:8000/api/auth/refresh/
  body:
    type: json
    data: |-
      {
        "refresh": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
