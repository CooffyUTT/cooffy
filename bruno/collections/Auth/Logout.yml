info:
  name: Logout
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8000/api/auth/logout/
  body:
    type: json
    data: |-
      {
        "refresh": "{{refresh_token}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setGlobalEnvVar("access_token", "");
        bru.setGlobalEnvVar("refresh_token", "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
