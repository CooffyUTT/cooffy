info:
  name: Add Product to Order
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/orders/product/
  body:
    type: urlencoded
    data: |-
      order_id=1
      item_id=2
      quantity=1
      price=8.00
      excluded_modifiers=["frío"]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
