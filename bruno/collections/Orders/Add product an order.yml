info:
  name: Add product an order
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8000/api/orders/1/add-product/
  body:
    type: json
    data: '{ "item_id": 20, "quantity": 1 }'
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
