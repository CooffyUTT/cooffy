info:
  name: Create Order - Cross Branch Rejected
  type: http
  seq: 10

# Smoke check for the cross-branch rule (RN-13).
# Expects 400 with the unavailable product in `order_products`.
# Pre-conditions: authenticated client; an existing branch with id 1
# and an active product with id 1 that has NO ProductStock(branch=1, product=1).

http:
  method: POST
  url: http://localhost:8000/api/orders/
  body:
    type: json
    data: |-
      {
        "branch_id": 1,
        "payment_method": "cash",
        "order_products": [
          {"item_id": 1, "quantity": 1}
        ]
      }
  auth:
    type: bearer
    token: "{{access_token}}"

  runtime:
    scripts:
      - type: tests
        code: |-
          test("rejects products not offered by the branch", () => {
            expect(res.status).to.equal(400);
            const data = res.getBody();
            expect(data).to.have.property("order_products");
            expect(data.order_products).to.be.an("array").with.length.greaterThan(0);
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
