info:
  name: Update Product
  type: http
  seq: 7

http:
  method: PATCH
  url: http://localhost:8000/api/menu/manage/products/1/
  body:
    type: multipart-form
    data:
      - name: name
        value: Chilaquiles verdes
        type: text
      - name: price
        value: "50.00"
        type: text
      - name: description
        value: Chilaquiles con salsa verde, crema y queso
        type: text
      - name: max_per_order
        value: "3"
        type: text
      - name: category
        value: "1"
        type: text
      - name: active
        value: "true"
        type: text
      - name: image
        type: file
        value: ""
        disabled: true
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
