info:
  name: Top Products
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8000/api/analytics/top-products/
  params:
    - name: period
      value: monthly
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", () => {
          expect(res.status).to.equal(200);
        });

        test("should return ranked products", () => {
          expect(res.body).to.have.property("period");
          expect(res.body).to.have.property("products");
          expect(res.body.products).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
