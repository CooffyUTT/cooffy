info:
  name: Orders by Hour
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8000/api/analytics/orders-by-hour/
  params:
    - name: period
      value: daily
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", () => {
          expect(res.status).to.equal(200);
        });

        test("should return 24 hour buckets", () => {
          expect(res.body).to.have.property("hours");
          expect(res.body.hours).to.be.an("array");
          expect(res.body.hours.length).to.equal(24);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
