info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/auth/login/
  body:
    type: form-urlencoded
    data:
      - name: user
        value: admin
      - name: password
        value: admin123
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.access
        method: jsonq
      variable:
        name: access_token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refresh
        method: jsonq
      variable:
        name: refresh_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
