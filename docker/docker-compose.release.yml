services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cooffy}
      POSTGRES_USER: ${POSTGRES_USER:-cooffy-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooffy-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/cooffyutt/cooffy-backend:${COOFFY_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-cooffy}
      POSTGRES_USER: ${POSTGRES_USER:-cooffy-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooffy-password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  frontend:
    image: ghcr.io/cooffyutt/cooffy-frontend:${COOFFY_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend

  nginx:
    image: ghcr.io/cooffyutt/cooffy-nginx:${COOFFY_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
      - static_data:/usr/share/nginx/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
